services:
  postgres:
    image: postgres:16-alpine
    container_name: jynta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jynta
      POSTGRES_PASSWORD: jynta_dev_password
      POSTGRES_DB: jynta_dev
    ports:
      - "5432:5432"
    volumes:
      - jynta_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jynta-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  jynta_postgres_data:
